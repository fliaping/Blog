{{ define "main" }}
<article class="article shell shell--full" data-article-body>
  <header class="article__head">
    <h1 class="article__title">{{ .Title }}</h1>
    {{- with .Description }}
    <div class="article__meta"><span>{{ . }}</span></div>
    {{- end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
